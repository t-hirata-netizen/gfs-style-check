<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 診断結果をシェアしたときに開くページ。LINE・SNS はこのページの画像（og:image）を表示する。タイプ名以外の情報は載せない -->
<title>企業ウォッチャー型（ファンダメンタルズ派）｜投資スタイル診断</title>
<meta name="description" content="GFS 投資スタイル診断で「企業ウォッチャー型（ファンダメンタルズ派）」でした。あなたはテクニカル派？ファンダメンタルズ派？">
<meta property="og:title" content="投資スタイル診断の結果：企業ウォッチャー型（ファンダメンタルズ派）">
<meta property="og:description" content="あなたはテクニカル派？ファンダメンタルズ派？ 22問・約5分でわかります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://t-hirata-netizen.github.io/gfs-style-check/fund.html">
<meta property="og:image" content="https://t-hirata-netizen.github.io/gfs-style-check/og/fund.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
:root{--bg:#F3F4F9;--surface:#FFFFFF;--ink:#16112E;--body:#3B3F5C;--muted:#63667F;--line:#DFE1EC;--focus:#7C5CFF;
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;--text:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#110C24;--surface:#1B1535;--ink:#F1EFFA;--body:#C9C6DC;--muted:#9591B0;--line:#2F2851}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#110C24;--surface:#1B1535;--ink:#F1EFFA;--body:#C9C6DC;--muted:#9591B0;--line:#2F2851}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--text);font-size:16px;line-height:1.7;padding:0 16px 40px}
.wrap{max-width:680px;margin:0 auto}
.logo{font-family:var(--display);color:var(--ink);font-size:15px;letter-spacing:.08em;padding:18px 0 10px}
.logo span{color:var(--muted);font-family:var(--text);font-weight:700;font-size:12px;margin-left:8px;letter-spacing:.1em}
.rhead{border-radius:20px;padding:28px 24px;margin-top:8px;background:linear-gradient(140deg,#E08A00,#F5A524);color:#16112E}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;opacity:.85}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,50px);line-height:1.25;margin:6px 0 0;color:inherit}
.style{font-weight:900;font-size:18px;margin-top:4px}
.rhead p{margin:12px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:14px}
.card h2{font-size:16px;color:var(--ink);margin:0 0 6px}
.cta{display:block;text-align:center;margin-top:18px;background:var(--ink);color:var(--bg);border-radius:14px;padding:17px;font-weight:900;font-size:17px;letter-spacing:.05em;text-decoration:none}
.cta:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">GFS<span>投資スタイル診断</span></div>
  <div class="rhead">
    <div class="eyebrow">シェアされた診断結果</div>
    <h1>企業ウォッチャー型</h1>
    <div class="style">ファンダメンタルズ派</div>
    <p>企業の中身を見て、じっくり育てるのが向いているタイプです。業績や配当を見て、長期で株を持つスタイルです。</p>
  </div>
  <div class="card">
    <h2>あなたはテクニカル派？ファンダメンタルズ派？</h2>
    <p style="margin:0">22問に答えるだけで、あなたに合う投資スタイルと、次に見る講義がわかります。回答はどこにも送信されません。</p>
    <a class="cta" href="./">自分も診断してみる</a>
  </div>
  <p class="note">※この診断は投資スタイルを選ぶための目安です。<br>※投資には元本割れなどのリスクがあります。</p>
</div>
</body>
</html>
